<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Jairus — LimitlessGreen: bioacoustics, audio tools and FPV">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .ph { animation: sweep 9s linear infinite; }
    @keyframes sweep { from { transform: translateX(384px); } to { transform: translateX(1280px); } }
    @media (prefers-reduced-motion: reduce) { .ph { animation: none; opacity: 0; } }
  </style>
  <defs>
    <clipPath id="r"><rect width="1280" height="320" rx="12"/></clipPath>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#3fd68a" stop-opacity="0"/>
      <stop offset="1" stop-color="#3fd68a" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="320" fill="#0d1117"/>
    <image width="1280" height="320" preserveAspectRatio="none" href="data:image/webp;base64,"/>
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"><line x1="0" x2="1280" y1="266.7" y2="266.7"/><line x1="0" x2="1280" y1="213.3" y2="213.3"/><line x1="0" x2="1280" y1="160.0" y2="160.0"/><line x1="0" x2="1280" y1="106.7" y2="106.7"/><line x1="0" x2="1280" y1="53.3" y2="53.3"/></g>
    <g class="m" font-size="12" fill="#7d8590" fill-opacity="0.8"><text x="1270" y="262.7" text-anchor="end">2 kHz</text><text x="1270" y="209.3" text-anchor="end">4 kHz</text><text x="1270" y="156.0" text-anchor="end">6 kHz</text><text x="1270" y="102.7" text-anchor="end">8 kHz</text><text x="1270" y="49.3" text-anchor="end">10 kHz</text></g>
    <g class="ph">
      <rect x="-60" width="60" height="320" fill="url(#g)"/>
      <rect x="-1" width="2" height="320" fill="#3fd68a"/>
    </g>
  </g>
  <g class="t">
    <text x="56" y="150" font-size="64" font-weight="700" fill="#e6edf3" letter-spacing="-1">Jairus</text>
    <text x="58" y="190" font-size="22" fill="#7d8590">Bioacoustics · Audio tools · FPV</text>
  </g>
  <g class="m" font-size="17" fill="#3fd68a">
    <text x="58" y="250">$ listen --to nature --and build tools for it</text>
  </g>
</svg>
